server {
    listen 80;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # 5 MB image limit of the API, plus the rest of the form
    client_max_body_size 6m;

    location /api/ {
        include /etc/nginx/conf.d/proxy.inc;
    }

    location /uploads/ {
        include /etc/nginx/conf.d/proxy.inc;
    }

    location / {
        # Second barrier against XSS: even if a script reached the page, the
        # browser would refuse to run it unless it comes from this site.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # React Router handles the pages: unknown paths get the application.
        try_files $uri /index.html;
    }
}
